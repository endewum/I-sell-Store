services:
  - type: worker
    name: i-sell-store
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: isell_store
      - key: ADMIN_ID
        value: "7695407294"
      - key: BINANCE_ID
        sync: false
      - key: USDT_BEP20_ADDRESS
        sync: false
      - key: SUPPORT_USERNAME
        value: ezrani
      - key: STORE_NAME
        value: ISell Store
      - key: STORE_CURRENCY
        value: USDT
